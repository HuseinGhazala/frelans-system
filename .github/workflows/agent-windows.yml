# بيبني ملف تسطيب برنامج الديسكتوب لـ Windows (Rased-Setup-x.y.z.exe)
# شغّله من تبويب Actions → "Build Windows agent" → Run workflow.
# بينشر الملف في GitHub Releases باسم ثابت Rased-Setup.exe، فرابط التحميل بيفضل واحد:
# https://github.com/<owner>/<repo>/releases/latest/download/Rased-Setup.exe
# رابط الموقع الافتراضي في البرنامج بييجي من متغير المستودع RASED_SERVER_URL (Settings → Variables).
name: Build Windows agent

on:
  workflow_dispatch:
  push:
    tags: ["agent-v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build installer
        working-directory: apps/agent
        env:
          NODE_ENV: production
          RASED_SERVER_URL: ${{ vars.RASED_SERVER_URL || 'https://rased.pixelcodes.net' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: Rased-Windows
          path: apps/agent/release/*.exe
          if-no-files-found: error
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./apps/agent/package.json').version")
          TAG="agent-v$VERSION"
          cp apps/agent/release/Rased-Setup-$VERSION.exe apps/agent/release/Rased-Setup.exe
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "برنامج راصد $VERSION" --notes "ملف تسطيب برنامج راصد لـ Windows."
          fi
          gh release upload "$TAG" apps/agent/release/Rased-Setup.exe "apps/agent/release/Rased-Setup-$VERSION.exe" --clobber
